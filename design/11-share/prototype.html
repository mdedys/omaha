<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Share your result</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EFE4}
a{color:#244A3E}a:hover{color:#163028}
.t{width:46px;height:46px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.t.o{background:#5CC98A}.t.c{background:#F4B13E}.t.x{background:#E05A2B}
.col{width:46px;text-align:center;font-size:10px;font-weight:800;letter-spacing:.04em;color:#B3C4BA;text-transform:uppercase}
.rl{width:44px;font-size:11px;font-weight:800;color:#B3C4BA;text-transform:uppercase;letter-spacing:.04em}
.stat{flex:1;display:flex;flex-direction:column;gap:6px}
.stat b{font-size:28px;font-weight:900;line-height:1;color:#E05A2B}
.stat span{font-size:12px;font-weight:600;color:#5A6B62;line-height:1}
.vs{flex:1;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.vs span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.vs b{font-size:17px;font-weight:900;line-height:1.1;text-transform:uppercase}
.cta{flex-grow:1;height:56px;border:none;border-radius:10px;background:#E05A2B;color:#FFFFFF;font:900 19px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
.sq{width:56px;height:56px;flex-shrink:0;border-radius:10px;border:2px solid #DCD3C1;background:#FFFFFF;color:#244A3E;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4EFE4; color: #244A3E; font-family: Figtree, sans-serif; overflow: hidden;">

<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #DCD3C1;">
  <span style="font-size: 22px; font-weight: 900; letter-spacing: .02em;">OMAHA</span>
  <button aria-label="Close" style="width: 44px; height: 44px; border: none; background: transparent; color: #244A3E; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</header>

<main style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 16px 22px; box-sizing: border-box;">
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-size: 52px; font-weight: 900; line-height: .9; letter-spacing: -0.01em;">CONVERTED</h1>
    <p style="margin: 0; font-size: 16px; font-weight: 600; color: #5A6B62;">3rd &amp; 10 · in 2 reps · +12 yards</p>
  </div>

  <section aria-label="Share card preview" style="background: #244A3E; color: #F4EFE4; border-radius: 16px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-size: 18px; font-weight: 900; letter-spacing: .02em;">OMAHA #148</span>
      <span style="font-size: 13px; font-weight: 800; color: #F4B13E;">3RD &amp; 10</span>
    </div>
    <div style="display: flex; justify-content: center; gap: 14px;" aria-label="Rep 1 incomplete, rep 2 converted for 12 yards, reps 3 and 4 not needed"><div style="display: flex; flex-direction: column; align-items: center; gap: 11px;"><span style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 12px; background: #E05A2B; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17"></path></svg></span><span style="font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #F4EFE4; line-height: 1.15; text-align: center;">Rep 1<br>Inc</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 11px;"><span style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 12px; background: #5CC98A; display: flex; align-items: center; justify-content: center;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1E2B22" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12.5l4 4 8-9"></path></svg></span><span style="font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #F4EFE4; line-height: 1.15; text-align: center;">Rep 2<br>+12</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 11px;"><span style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 12px; border: 2px dashed #3D6B5B; display: flex; align-items: center; justify-content: center;"></span><span style="font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #7F978B; line-height: 1.15; text-align: center;">Rep 3<br>—</span></div><div style="display: flex; flex-direction: column; align-items: center; gap: 11px;"><span style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 12px; border: 2px dashed #3D6B5B; display: flex; align-items: center; justify-content: center;"></span><span style="font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: #7F978B; line-height: 1.15; text-align: center;">Rep 4<br>—</span></div></div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid #3D6B5B;">
      <span style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 14px; border: 1.5px solid #F4B13E; color: #F4B13E; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;">Beat the pros</span>
      <span style="font-size: 15px; font-weight: 800;">77 pts</span>
    </div>
  </section>

  <div style="display: flex; gap: 8px;">
    <div class="vs" style="background: #FFFFFF; border: 1px solid #DCD3C1;"><span style="color: #5A6B62;">The pros</span><b style="color: #244A3E;">Incomplete</b></div>
    <div class="vs" style="background: #244A3E;"><span style="color: #B3C4BA;">You</span><b style="color: #F4EFE4;">+12 · 1st down</b></div>
  </div>

  <div style="display: flex; gap: 12px; padding: 14px 0; border-top: 1px solid #DCD3C1; border-bottom: 1px solid #DCD3C1;">
    <div class="stat"><b>77</b><span>score</span></div>
    <div class="stat"><b>4</b><span>day streak</span></div>
    <div class="stat"><b>38%</b><span>beat the pros</span></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; gap: 8px;">
      <button class="sq" aria-label="Copy result"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg></button>
      <button class="cta"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>Share result</button>
    </div>
    <p style="margin: 0; text-align: center; font-size: 13px; font-weight: 600; color: #5A6B62; font-variant-numeric: tabular-nums;">Next puzzle in 07:42:19</p>
  </div>
</main>
</div>
</body>
</html>
