<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop: Goal to Go</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>

body{margin:0;background:#F4EFE4}
a{color:#244A3E}a:hover{color:#163028}
.app{min-height:100vh;display:flex;flex-direction:column;background:#F4EFE4;color:#244A3E;font-family:Figtree,sans-serif}
.top{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;border-bottom:1px solid #DCD3C1}
.brand{font-size:24px;font-weight:900;letter-spacing:.02em}
.sit{display:flex;align-items:baseline;gap:10px}
.sit b{font-size:20px;font-weight:900;text-transform:uppercase}
.sit span{font-size:14px;font-weight:800;color:#5A6B62;text-transform:uppercase}
.meta{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;color:#5A6B62;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:5px}.pips i{width:9px;height:9px;border-radius:5px;background:#DCD3C1}.pips i.on{background:#244A3E}.pips i.ring{box-sizing:border-box;background:transparent;border:2px solid #244A3E}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.stage{position:relative;overflow:hidden;background:#0C3322;display:flex;align-items:center;justify-content:center;padding:24px;min-height:0}
.field{display:block;height:calc(100vh - 112px);width:auto;max-width:100%;border-radius:10px}
.pill{position:absolute;top:36px;height:30px;padding:0 12px;border-radius:15px;background:rgba(6,13,10,.82);color:#F4EFE4;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.panel{border-left:1px solid #DCD3C1;padding:28px;display:flex;flex-direction:column;gap:22px;min-height:0;box-sizing:border-box}
.grow{flex-grow:1}
.steps{display:flex;gap:10px}
.steps div{flex:1;display:flex;flex-direction:column;gap:8px}
.steps i{height:4px;border-radius:2px;background:#DCD3C1}
.steps span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:#5A6B62}
.steps .done i{background:#244A3E;opacity:.45}.steps .now i{background:#244A3E}.steps .now span{color:#244A3E}
.lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.lab span{color:#5A6B62;font-weight:700;text-transform:none;letter-spacing:0}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{box-sizing:border-box;border-radius:10px;border:2px solid #DCD3C1;background:#FFFFFF;display:flex;flex-direction:column;overflow:hidden;padding:0;color:#244A3E;font:800 13px Figtree,sans-serif;text-transform:uppercase;cursor:pointer}
.card svg{display:block;width:100%;height:auto}
.card span{height:34px;display:flex;align-items:center;justify-content:center}
.card.sel{border-color:#244A3E}.card.sel span{background:#244A3E;color:#F4EFE4}
.seg{display:flex;background:#FFFFFF;border:1px solid #DCD3C1;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:42px;border:none;border-radius:9px;background:transparent;color:#5A6B62;font:800 14px Figtree,sans-serif;text-transform:uppercase;cursor:pointer}
.seg button.sel{background:#244A3E;color:#F4EFE4}
.cta{height:58px;border:none;border-radius:10px;background:#E05A2B;color:#FFFFFF;font:900 19px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;width:100%}
kbd{font:700 11px Figtree,sans-serif;padding:3px 7px;border-radius:5px;background:rgba(255,255,255,.22);color:inherit;text-transform:none;letter-spacing:0}
.hint{font-size:12px;font-weight:600;color:#5A6B62;text-align:center}
.hint kbd{background:#FFFFFF;border:1px solid #DCD3C1;color:#244A3E}
.ib{width:52px;height:52px;border:none;border-radius:26px;background:transparent;color:#244A3E;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ib.play{width:68px;height:68px;border-radius:34px;background:#244A3E;color:#F4EFE4}
.mom{display:flex;flex-direction:column;gap:8px}
.mom button{height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #DCD3C1;background:#FFFFFF;color:#244A3E;font-family:Figtree,sans-serif;display:flex;align-items:center;justify-content:space-between;padding:0 16px;cursor:pointer}
.mom b{font-size:14px;font-weight:800;text-transform:uppercase}.mom i{font-style:normal;font-size:13px;font-weight:600;color:#5A6B62;font-variant-numeric:tabular-nums}
.mom button.sel{border:2px solid #244A3E;padding:0 15px}
.stat{flex:1;display:flex;flex-direction:column;gap:6px}
.stat b{font-size:32px;font-weight:900;line-height:1;color:#E05A2B}
.stat span{font-size:13px;font-weight:600;color:#5A6B62;line-height:1}
.rule{border-top:1px solid #DCD3C1;border-bottom:1px solid #DCD3C1;padding:16px 0}
.life{width:34px;height:34px;box-sizing:border-box;border-radius:8px;border:1.5px solid #DCD3C1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#5A6B62}
.life.lost{border-color:#244A3E;background:rgba(36,74,62,.12)}.life.next{border-color:#244A3E;color:#244A3E}
.sq{width:58px;height:58px;flex-shrink:0;border-radius:10px;border:2px solid #DCD3C1;background:#FFFFFF;color:#244A3E;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.t{border-radius:12px;display:flex;align-items:center;justify-content:center}
.t.o{background:#5CC98A}.t.c{background:#F4B13E}.t.x{background:#E05A2B}
.vs{flex:1;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:7px}
.vs span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.vs b{font-size:19px;font-weight:900;line-height:1.1;text-transform:uppercase}
.share-wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;max-width:1120px;width:100%;margin:0 auto;padding:48px 32px;box-sizing:border-box}
@media (max-width:900px){
.body{grid-template-columns:minmax(0,1fr)}
.stage{padding:0;min-width:0}
.field{width:100%;height:auto;max-height:none;border-radius:0}
.hint,.cta kbd{display:none}
.panel{min-width:0}
.pill{top:12px}
.panel{border-left:none;padding:16px}
.top{padding:0 16px}
.sit span,.meta .num{display:none}
.share-wrap{grid-template-columns:1fr;gap:24px;padding:20px 16px}
}

.ropt{height:60px;box-sizing:border-box;border-radius:12px;border:1px solid #DCD3C1;background:#FFFFFF;display:flex;align-items:center;gap:12px;padding:0 16px;color:#244A3E;font-family:Figtree,sans-serif;text-align:left;cursor:pointer;width:100%}
.ropt.sel{border:2px solid #244A3E;padding:0 15px}
.ropt .tx{flex-grow:1;display:flex;flex-direction:column;gap:4px}.ropt .nm{font-size:16px;font-weight:700;line-height:1}.ropt .rt{font-size:13px;color:#5A6B62;line-height:1}
</style>
</head>
