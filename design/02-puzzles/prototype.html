<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle overview</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EFE4}
a{color:#244A3E}a:hover{color:#163028}
.seg{display:flex;background:#FFFFFF;border:1px solid #DCD3C1;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border:none;border-radius:9px;background:transparent;color:#5A6B62;font:800 13px Figtree,sans-serif;text-transform:uppercase;cursor:pointer}
.seg button.sel{background:#244A3E;color:#F4EFE4}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #DCD3C1;text-decoration:none;color:#244A3E}
.row:hover{color:#244A3E}
.th{width:56px;height:56px;flex-shrink:0;border-radius:10px;overflow:hidden;display:block}
.tx{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.dd{display:flex;align-items:baseline;gap:6px}
.dd b{font-size:17px;font-weight:900;text-transform:uppercase;line-height:1}
.dd span{font-size:12px;font-weight:800;text-transform:uppercase;color:#5A6B62;line-height:1}
.meta{font-size:13px;color:#5A6B62;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{flex-shrink:0;height:26px;padding:0 10px;border-radius:13px;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;text-transform:uppercase;line-height:1}
.st.won{background:#244A3E;color:#F4EFE4}
.st.lost{border:1.5px solid #B9AE99;color:#5A6B62;box-sizing:border-box}
.st.open{border:1.5px solid #B4441C;color:#B4441C;box-sizing:border-box}
.day{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#5A6B62;padding-top:16px}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4EFE4; color: #244A3E; font-family: Figtree, sans-serif; overflow: hidden;">

<header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid #DCD3C1;">

  <h1 style="margin: 0; font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em;">Puzzles</h1>

<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 16px 16px 0; box-sizing: border-box; overflow: hidden;">

    <a class="row" href="../08-result/prototype.html">
      <svg class="th" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="#0F3A27"></rect><path d="M0 34H56" stroke="#E2C044" stroke-width="1.6"></path><path d="M0 44H56" stroke="#3B8EEA" stroke-width="1.6"></path><path d="M0 8H56" stroke="#F4EFE4" stroke-opacity=".5" stroke-width="3"></path><g fill="#A4AAAF"><circle cx="18" cy="44" r="2.6"></circle><circle cx="23" cy="44" r="2.6"></circle><circle cx="28" cy="44" r="2.6"></circle><circle cx="33" cy="44" r="2.6"></circle><circle cx="38" cy="44" r="2.6"></circle></g><circle cx="28" cy="51" r="2.8" fill="#F2F5F3"></circle></svg>

    <a class="row" href="../08-result/prototype.html">
      <svg class="th" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="#0F3A27"></rect><path d="M0 27H56" stroke="#E2C044" stroke-width="1.6"></path><path d="M0 44H56" stroke="#3B8EEA" stroke-width="1.6"></path><g fill="#A4AAAF"><circle cx="18" cy="44" r="2.6"></circle><circle cx="23" cy="44" r="2.6"></circle><circle cx="28" cy="44" r="2.6"></circle><circle cx="33" cy="44" r="2.6"></circle><circle cx="38" cy="44" r="2.6"></circle></g><circle cx="28" cy="51" r="2.8" fill="#F2F5F3"></circle></svg>
      <span class="tx"><span class="dd"><b>3rd &amp; 7</b><span>own 30</span></span><span class="meta">Tied late. Don't blink.</span></span>

    <a class="row" href="../08-result/prototype.html">

      <span class="tx"><span class="dd"><b>1st &amp; 10</b><span>own 20</span></span><span class="meta">Up 1. Milk the clock.</span></span>
      <span class="st won"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2L5 8.6L9.6 3.6" fill="none" stroke="#F4EFE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>Rep 1</span>

    <a class="row" href="../08-result/prototype.html">
      <svg class="th" viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="#0F3A27"></rect><path d="M0 11H56" stroke="#E2C044" stroke-width="1.6"></path><path d="M0 44H56" stroke="#3B8EEA" stroke-width="1.6"></path><g fill="#A4AAAF"><circle cx="18" cy="44" r="2.6"></circle><circle cx="23" cy="44" r="2.6"></circle><circle cx="28" cy="44" r="2.6"></circle><circle cx="33" cy="44" r="2.6"></circle><circle cx="38" cy="44" r="2.6"></circle></g><circle cx="28" cy="51" r="2.8" fill="#F2F5F3"></circle></svg>
      <span class="tx"><span class="dd"><b>3rd &amp; 14</b><span>opp 35</span></span><span class="meta">Kicker is warming up.</span></span>
      <span class="st won"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2L5 8.6L9.6 3.6" fill="none" stroke="#F4EFE4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>Rep 3</span>

</div>
