<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EFE4}
a{color:#244A3E}a:hover{color:#fff}
.ib{width:48px;height:48px;border:none;border-radius:24px;background:transparent;color:#244A3E;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ib.play{width:60px;height:60px;border-radius:30px;background:#244A3E;color:#F4EFE4}
.seg{display:flex;background:#FFFFFF;border:1px solid #DCD3C1;border-radius:10px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 9px;border:none;border-radius:8px;background:transparent;color:#5A6B62;font:600 12px Figtree,sans-serif;cursor:pointer;font-weight:800;text-transform:uppercase}
.seg button.sel{background:#244A3E;color:#F4EFE4}
.km{flex:1;height:46px;box-sizing:border-box;border-radius:12px;border:1px solid #DCD3C1;background:#FFFFFF;color:#244A3E;font-family:Figtree,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;cursor:pointer}
.km b{font-size:13px;font-weight:600;line-height:1;font-weight:800;text-transform:uppercase}
.km i{font-style:normal;font-size:11px;color:#5A6B62;line-height:1;font-variant-numeric:tabular-nums}
.km.sel{border:2px solid #244A3E}
.cta{height:52px;border:none;border-radius:14px;background:#E05A2B;color:#FFFFFF;font:700 16px Figtree,sans-serif;cursor:pointer;text-transform:uppercase;font-weight:900;letter-spacing:.01em}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4EFE4; color: #244A3E; font-family: Figtree, sans-serif; overflow: hidden;">

<header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #DCD3C1;">
  <span style="display: flex; align-items: baseline; gap: 6px;"><span style="font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em;">3rd &amp; 10</span><span style="font-size: 13px; font-weight: 800; color: #5A6B62; text-transform: uppercase;">own 45</span></span>
  <span style="display: flex; align-items: center; gap: 12px;">
    <span style="font-size: 13px; color: #5A6B62; font-variant-numeric: tabular-nums;">Down 4 · 1:12</span>
    <span style="display: flex; gap: 5px;" aria-label="Rep 1 used, 3 left"><span style="width: 8px; height: 8px; border-radius: 4px; background: #5A6B62;"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #DCD3C1;"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #DCD3C1;"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #DCD3C1;"></span></span>
  </span>
</header>

<div style="position: relative; flex-shrink: 0;">
<svg width="390" height="479" viewBox="0 0 403 495" role="img" aria-label="Replay paused at the throw: both teams moving, no play art; the ball is on its way to the tight end" style="display: block;">
  <defs>
    <pattern id="hash" width="403" height="12.8" patternUnits="userSpaceOnUse" y="47"><path d="M141 0.5H155M247 0.5H261" stroke="#D5E0D9" stroke-opacity=".55" stroke-width="1"></path></pattern>
  </defs>
  <rect width="403" height="495" fill="#0F3A27"></rect>
  <g fill="#113F2A"><rect y="47" width="403" height="63"></rect><rect y="175" width="403" height="63"></rect><rect y="302" width="403" height="64"></rect><rect y="432" width="403" height="63"></rect></g>
  <rect width="403" height="495" fill="url(#hash)"></rect>
  <path d="M0 47H403M0 110H403M0 175H403M0 238H403M0 302H403M0 366H403M0 432H403M1 0V495M402 0V495" stroke="#D5E0D9" stroke-opacity=".45" stroke-width="1"></path>
  <g font-family="Figtree, sans-serif" font-weight="700" font-size="22" fill="#A7B2AC" fill-opacity=".8" text-anchor="middle" dominant-baseline="central">
    <text transform="translate(52 47) rotate(90)">30</text><text transform="translate(52 176) rotate(90)">40</text><text transform="translate(52 302) rotate(90)">50</text><text transform="translate(52 432) rotate(90)">40</text>
    <text transform="translate(350 47) rotate(-90)">30</text><text transform="translate(350 176) rotate(-90)">40</text><text transform="translate(350 302) rotate(-90)">50</text><text transform="translate(350 432) rotate(-90)">40</text>
  </g>
  <path d="M0 238H403" stroke="#E2C044" stroke-width="2"></path>
  <path d="M0 366H403" stroke="#3B8EEA" stroke-width="2"></path>

  <g fill="#071710" stroke="#F4EFE4" stroke-width="2.2">
    <circle cx="298" cy="250" r="7.5"></circle><circle cx="186" cy="204" r="7.5"></circle><circle cx="176" cy="296" r="7.5"></circle><circle cx="240" cy="292" r="7.5"></circle><circle cx="160" cy="354" r="7.5"></circle><circle cx="196" cy="352" r="7.5"></circle><circle cx="226" cy="352" r="7.5"></circle><circle cx="262" cy="358" r="7.5"></circle><circle cx="60" cy="272" r="7.5"></circle><circle cx="350" cy="252" r="7.5"></circle><circle cx="378" cy="214" r="7.5"></circle>
  </g>

  <path d="M201 432Q236 330 280 290" fill="none" stroke="#F2F5F3" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round"></path>
  <ellipse cx="282" cy="288" rx="4" ry="2.6" transform="rotate(-42 282 288)" fill="#8B5A2B" stroke="#F2F5F3" stroke-width="0.8"></ellipse>

  <g fill="#A4AAAF" stroke="#DADDE0" stroke-width="1.2"><circle cx="160" cy="370" r="8"></circle><circle cx="181" cy="370" r="8"></circle><circle cx="202" cy="370" r="8"></circle><circle cx="223" cy="370" r="8"></circle><circle cx="244" cy="370" r="8"></circle></g>

  <g font-family="Figtree, sans-serif" font-size="6.5" font-weight="700" text-anchor="middle">
    <g transform="translate(140 229)"><circle r="8.5" fill="#0E2219" stroke="#EAC54F" stroke-width="2.2"></circle><text y="2.3" fill="#fff">WR</text></g>
    <g transform="translate(318 255)"><circle r="8.5" fill="#0E2219" stroke="#8E73F2" stroke-width="2.2"></circle><text y="2.3" fill="#fff">TE</text></g>
    <g transform="translate(366 238)"><circle r="8.5" fill="#0E2219" stroke="#F0607A" stroke-width="2.2"></circle><text y="2.3" fill="#fff">WR</text></g>
    <g transform="translate(385 196)"><circle r="8.5" fill="#0E2219" stroke="#55AEF5" stroke-width="2.2"></circle><text y="2.3" fill="#fff">WR</text></g>
    <g transform="translate(266 389)"><circle r="8.5" fill="#0E2219" stroke="#5BDB8C" stroke-width="2.2"></circle><text y="2.3" fill="#fff">RB</text></g>
    <g transform="translate(201 440)"><circle r="8.5" fill="#F2F5F3"></circle><text y="2.3" fill="#0A1410">QB</text></g>
  </g>
</svg>
  <span style="position: absolute; left: 12px; top: 12px; height: 26px; padding: 0 10px; border-radius: 13px; background: rgba(10,20,16,.78); color: #F4EFE4; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;">
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1" width="2.4" height="8" rx="0.6" fill="#F4EFE4"></rect><rect x="6.1" y="1" width="2.4" height="8" rx="0.6" fill="#F4EFE4"></rect></svg>
    Rep 1 replay
  </span>
</div>

<footer aria-label="Playback" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 16px 16px 22px; box-sizing: border-box;">
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="position: relative; height: 14px;">
      <div style="position: absolute; top: 5px; left: 0; width: calc(47% - 1px); height: 4px; border-radius: 2px; background: #244A3E;"></div>
      <div style="position: absolute; top: 5px; left: calc(47% + 1px); width: calc(21% - 2px); height: 4px; border-radius: 2px; background: #244A3E;"></div>
      <div style="position: absolute; top: 5px; left: calc(68% + 1px); right: 0; height: 4px; border-radius: 2px; background: #DCD3C1;"></div>
      <div role="slider" aria-label="Replay position" aria-valuemin="0" aria-valuemax="3.4" aria-valuenow="2.3" aria-valuetext="2.3 seconds, throw" tabindex="0" style="position: absolute; top: 0; left: calc(68% - 7px); width: 14px; height: 14px; border-radius: 7px; background: #244A3E; box-shadow: 0 1px 4px rgba(0,0,0,.5);"></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums;">2.3s <span style="color: #5A6B62; font-weight: 500;">/ 3.4s</span></span>
      <div class="seg" role="radiogroup" aria-label="Playback speed"><button role="radio" aria-checked="false">0.25×</button><button class="sel" role="radio" aria-checked="true">0.5×</button><button role="radio" aria-checked="false">1×</button></div>
    </div>
  </div>
  <div style="display: flex; align-items: center; justify-content: center; gap: 20px;">
    <button class="ib" aria-label="Back one frame"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.4" height="14" rx="1"></rect><path d="M19 5v14L9 12z"></path></svg></button>
    <button class="ib play" aria-label="Play"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg></button>
    <button class="ib" aria-label="Forward one frame"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.6" y="5" width="2.4" height="14" rx="1"></rect><path d="M5 5v14l10-7z"></path></svg></button>
  </div>
  <div style="display: flex; gap: 8px;" role="group" aria-label="Jump to a moment">
    <button class="km"><b>Snap</b><i>0.0s</i></button>
    <button class="km"><b>Break</b><i>1.6s</i></button>
    <button class="km sel" aria-pressed="true"><b>Throw</b><i>2.3s</i></button>
    <button class="km"><b>End</b><i>3.4s</i></button>
  </div>
  <button class="cta">Back to the result</button>
</footer>
</div>
</body>
</html>
