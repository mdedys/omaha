<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop: replay (dark)</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>

body{margin:0;background:#18201C}
a{color:#F4EFE4}a:hover{color:#FFFFFF}
.app{min-height:100vh;display:flex;flex-direction:column;background:#18201C;color:#F4EFE4;font-family:Figtree,sans-serif}
.top{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;border-bottom:1px solid #34403A}
.brand{font-size:24px;font-weight:900;letter-spacing:.02em}
.sit{display:flex;align-items:baseline;gap:10px}
.sit b{font-size:20px;font-weight:900;text-transform:uppercase}
.sit span{font-size:14px;font-weight:800;color:#A3B1A9;text-transform:uppercase}
.meta{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;color:#A3B1A9;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:5px}.pips i{width:9px;height:9px;border-radius:5px;background:#34403A}.pips i.on{background:#F4EFE4}.pips i.ring{box-sizing:border-box;background:transparent;border:2px solid #F4EFE4}
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
.stage{position:relative;background:#0C3322;display:flex;align-items:center;justify-content:center;padding:24px;min-height:0}
.field{display:block;height:calc(100vh - 112px);width:auto;max-width:100%;border-radius:10px}
.pill{position:absolute;top:36px;height:30px;padding:0 12px;border-radius:15px;background:rgba(6,13,10,.82);color:#F4EFE4;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}
.panel{border-left:1px solid #34403A;padding:28px;display:flex;flex-direction:column;gap:22px;min-height:0;box-sizing:border-box}
.grow{flex-grow:1}
.steps{display:flex;gap:10px}
.steps div{flex:1;display:flex;flex-direction:column;gap:8px}
.steps i{height:4px;border-radius:2px;background:#34403A}
.steps span{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:#A3B1A9}
.steps .done i{background:#F4EFE4;opacity:.45}.steps .now i{background:#F4EFE4}.steps .now span{color:#F4EFE4}
.lab{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.lab span{color:#A3B1A9;font-weight:700;text-transform:none;letter-spacing:0}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{box-sizing:border-box;border-radius:10px;border:2px solid #34403A;background:#232C27;display:flex;flex-direction:column;overflow:hidden;padding:0;color:#F4EFE4;font:800 13px Figtree,sans-serif;text-transform:uppercase;cursor:pointer}
.card svg{display:block;width:100%;height:auto}
.card span{height:34px;display:flex;align-items:center;justify-content:center}
.card.sel{border-color:#F4EFE4}.card.sel span{background:#F4EFE4;color:#18201C}
.seg{display:flex;background:#232C27;border:1px solid #34403A;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:42px;border:none;border-radius:9px;background:transparent;color:#A3B1A9;font:800 14px Figtree,sans-serif;text-transform:uppercase;cursor:pointer}
.seg button.sel{background:#F4EFE4;color:#18201C}
.cta{height:58px;border:none;border-radius:10px;background:#E05A2B;color:#FFFFFF;font:900 19px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;width:100%}
kbd{font:700 11px Figtree,sans-serif;padding:3px 7px;border-radius:5px;background:rgba(255,255,255,.22);color:inherit;text-transform:none;letter-spacing:0}
.hint{font-size:12px;font-weight:600;color:#A3B1A9;text-align:center}
.hint kbd{background:#232C27;border:1px solid #34403A;color:#F4EFE4}
.ib{width:52px;height:52px;border:none;border-radius:26px;background:transparent;color:#F4EFE4;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.ib.play{width:68px;height:68px;border-radius:34px;background:#F4EFE4;color:#18201C}
.mom{display:flex;flex-direction:column;gap:8px}
.mom button{height:52px;box-sizing:border-box;border-radius:10px;border:1px solid #34403A;background:#232C27;color:#F4EFE4;font-family:Figtree,sans-serif;display:flex;align-items:center;justify-content:space-between;padding:0 16px;cursor:pointer}
.mom b{font-size:14px;font-weight:800;text-transform:uppercase}.mom i{font-style:normal;font-size:13px;font-weight:600;color:#A3B1A9;font-variant-numeric:tabular-nums}
.mom button.sel{border:2px solid #F4EFE4;padding:0 15px}
.stat{flex:1;display:flex;flex-direction:column;gap:6px}
.stat b{font-size:32px;font-weight:900;line-height:1;color:#E05A2B}
.stat span{font-size:13px;font-weight:600;color:#A3B1A9;line-height:1}
.rule{border-top:1px solid #34403A;border-bottom:1px solid #34403A;padding:16px 0}
.life{width:34px;height:34px;box-sizing:border-box;border-radius:8px;border:1.5px solid #34403A;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#A3B1A9}
.life.lost{border-color:#F4EFE4;background:rgba(244,239,228,.14)}.life.next{border-color:#F4EFE4;color:#F4EFE4}
.sq{width:58px;height:58px;flex-shrink:0;border-radius:10px;border:2px solid #34403A;background:#232C27;color:#F4EFE4;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.t{border-radius:12px;display:flex;align-items:center;justify-content:center}
.t.o{background:#5CC98A}.t.c{background:#F4B13E}.t.x{background:#E05A2B}
.vs{flex:1;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:7px}
.vs span{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.vs b{font-size:19px;font-weight:900;line-height:1.1;text-transform:uppercase}
.share-wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;max-width:1120px;width:100%;margin:0 auto;padding:48px 32px;box-sizing:border-box}
@media (max-width:900px){
.body{grid-template-columns:minmax(0,1fr)}
.stage{padding:0;min-width:0}
.field{width:100%;height:auto;max-height:none;border-radius:0}
.hint,.cta kbd{display:none}
.panel{min-width:0}
.pill{top:12px}
.panel{border-left:none;padding:16px}
.top{padding:0 16px}
.sit span,.meta .num{display:none}
.share-wrap{grid-template-columns:1fr;gap:24px;padding:20px 16px}
}

</style>
</head>
<body>
<div class="app">
<header class="top"><span class="brand">OMAHA</span><span class="sit"><b>3rd &amp; 10</b><span>own 45</span></span><span class="meta"><span class="num">#148</span><span>Down 4 · 1:12</span><span class="pips" aria-label="Rep 1 used, 3 left"><i class="on" style="background: #A3B1A9;"></i><i></i><i></i><i></i></span></span></header>
<div class="body">
<div class="stage"><svg class="field" width="403" height="495" viewBox="0 0 403 495" role="img" aria-label="Replay paused at the throw: both teams moving, no play art; the ball is on its way to the tight end">
  <defs>
    <pattern id="hash" width="403" height="12.8" patternUnits="userSpaceOnUse" y="47"><path d="M141 0.5H155M247 0.5H261" stroke="#D5E0D9" stroke-opacity=".55" stroke-width="1"></path></pattern>
  </defs>
  <rect width="403" height="495" fill="#0F3A27"></rect>
  <g fill="#113F2A"><rect y="47" width="403" height="63"></rect><rect y="175" width="403" height="63"></rect><rect y="302" width="403" height="64"></rect><rect y="432" width="403" height="63"></rect></g>
  <rect width="403" height="495" fill="url(#hash)"></rect>
  <path d="M0 47H403M0 110H403M0 175H403M0 238H403M0 302H403M0 366H403M0 432H403M1 0V495M402 0V495" stroke="#D5E0D9" stroke-opacity=".45" stroke-width="1"></path>
  <g font-family="Figtree, sans-serif" font-weight="700" font-size="22" fill="#A7B2AC" fill-opacity=".8" text-anchor="middle" dominant-baseline="central">
    <text transform="translate(52 47) rotate(90)">30</text><text transform="translate(52 176) rotate(90)">40</text><text transform="translate(52 302) rotate(90)">50</text><text transform="translate(52 432) rotate(90)">40</text>
    <text transform="translate(350 47) rotate(-90)">30</text><text transform="translate(350 176) rotate(-90)">40</text><text transform="translate(350 302) rotate(-90)">50</text><text transform="translate(350 432) rotate(-90)">40</text>
  </g>
  <path d="M0 238H403" stroke="#E2C044" stroke-width="2"></path>
  <path d="M0 366H403" stroke="#3B8EEA" stroke-width="2"></path>

  <g fill="#071710" stroke="#F4EFE4" stroke-width="2.2">
    <circle cx="298" cy="250" r="7.5"></circle><circle cx="186" cy="204" r="7.5"></circle><circle cx="176" cy="296" r="7.5"></circle><circle cx="240" cy="292" r="7.5"></circle><circle cx="160" cy="354" r="7.5"></circle><circle cx="196" cy="352" r="7.5"></circle><circle cx="226" cy="352" r="7.5"></circle><circle cx="262" cy="358" r="7.5"></circle><circle cx="60" cy="272" r="7.5"></circle><circle cx="350" cy="252" r="7.5"></circle><circle cx="378" cy="214" r="7.5"></circle>
  </g>

  <path d="M201 432Q236 330 280 290" fill="none" stroke="#F2F5F3" stroke-width="1.8" stroke-dasharray="2 5" stroke-linecap="round"></path>
  <ellipse cx="282" cy="288" rx="4" ry="2.6" transform="rotate(-42 282 288)" fill="#8B5A2B" stroke="#F2F5F3" stroke-width="0.8"></ellipse>

  <g fill="#A4AAAF" stroke="#DADDE0" stroke-width="1.2"><circle cx="160" cy="370" r="8"></circle><circle cx="181" cy="370" r="8"></circle><circle cx="202" cy="370" r="8"></circle><circle cx="223" cy="370" r="8"></circle><circle cx="244" cy="370" r="8"></circle></g>

  <g font-family="Figtree, sans-serif" font-size="6.5" font-weight="700" text-anchor="middle">
    <g transform="translate(140 229)"><circle r="8.5" fill="#0E2219" stroke="#EAC54F" stroke-width="2.2"></circle><text y="2.3" fill="#fff">WR</text></g>
    <g transform="translate(318 255)"><circle r="8.5" fill="#0E2219" stroke="#8E73F2" stroke-width="2.2"></circle><text y="2.3" fill="#fff">TE</text></g>
    <g transform="translate(366 238)"><circle r="8.5" fill="#0E2219" stroke="#F0607A" stroke-width="2.2"></circle><text y="2.3" fill="#fff">WR</text></g>
    <g transform="translate(385 196)"><circle r="8.5" fill="#0E2219" stroke="#55AEF5" stroke-width="2.2"></circle><text y="2.3" fill="#fff">WR</text></g>
    <g transform="translate(266 389)"><circle r="8.5" fill="#0E2219" stroke="#5BDB8C" stroke-width="2.2"></circle><text y="2.3" fill="#fff">RB</text></g>
    <g transform="translate(201 440)"><circle r="8.5" fill="#F2F5F3"></circle><text y="2.3" fill="#0A1410">QB</text></g>
  </g>
</svg><span class="pill" style="left: 36px;"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1.5" y="1" width="2.4" height="8" rx="0.6" fill="#F4EFE4"></rect><rect x="6.1" y="1" width="2.4" height="8" rx="0.6" fill="#F4EFE4"></rect></svg>Rep 1 replay</span></div>
<aside class="panel" aria-label="Playback">
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="position: relative; height: 14px;">
<div style="position: absolute; top: 5px; left: 0; width: calc(47% - 1px); height: 4px; border-radius: 2px; background: #F4EFE4;"></div>
<div style="position: absolute; top: 5px; left: calc(47% + 1px); width: calc(21% - 2px); height: 4px; border-radius: 2px; background: #F4EFE4;"></div>
<div style="position: absolute; top: 5px; left: calc(68% + 1px); right: 0; height: 4px; border-radius: 2px; background: #34403A;"></div>
<div role="slider" aria-label="Replay position" aria-valuemin="0" aria-valuemax="3.4" aria-valuenow="2.3" tabindex="0" style="position: absolute; top: 0; left: calc(68% - 7px); width: 14px; height: 14px; border-radius: 7px; background: #F4EFE4; box-shadow: 0 1px 4px rgba(0,0,0,.5);"></div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">2.3s <span style="color: #A3B1A9; font-weight: 600;">/ 3.4s</span></span><div class="seg" style="width: 180px;" role="radiogroup" aria-label="Playback speed"><button role="radio" aria-checked="false" style="height: 32px;">0.25×</button><button class="sel" role="radio" aria-checked="true" style="height: 32px;">0.5×</button><button role="radio" aria-checked="false" style="height: 32px;">1×</button></div></div>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 24px;">
<button class="ib" aria-label="Back one frame"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="2.4" height="14" rx="1"></rect><path d="M19 5v14L9 12z"></path></svg></button>
<button class="ib play" aria-label="Play"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg></button>
<button class="ib" aria-label="Forward one frame"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.6" y="5" width="2.4" height="14" rx="1"></rect><path d="M5 5v14l10-7z"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;"><div class="lab">Jump to</div>
<div class="mom" role="group" aria-label="Jump to a moment"><button><b>Snap</b><i>0.0s</i></button><button><b>Break</b><i>1.6s</i></button><button class="sel" aria-pressed="true"><b>Throw</b><i>2.3s</i></button><button><b>End</b><i>3.4s</i></button></div></div>
<div class="grow"></div>
<div style="display: flex; flex-direction: column; gap: 10px;"><button class="cta">Back to the result <kbd>Enter</kbd></button><p class="hint" style="margin: 0;"><kbd>Space</kbd> play/pause · <kbd>,</kbd> <kbd>.</kbd> step a frame</p></div>
</aside>
</div>
</div>
</body>
</html>
