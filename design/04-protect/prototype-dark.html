<!doctype html>

<title>Step 1: Protect (dark)</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#18201C}
a{color:#F4EFE4}a:hover{color:#fff}
.step{flex:1;display:flex;flex-direction:column;gap:7px}
.bar{height:3px;border-radius:2px;background:#34403A}

.sh span{color:#A3B1A9}

.seg button{flex:1;height:40px;border:none;border-radius:9px;background:transparent;color:#A3B1A9;font:600 14px Figtree,sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:800;text-transform:uppercase}
.seg button.sel{background:#F4EFE4;color:#18201C}
.cta{height:52px;border:none;border-radius:14px;background:#E05A2B;color:#FFFFFF;font:700 16px Figtree,sans-serif;cursor:pointer;text-transform:uppercase;font-weight:900;letter-spacing:.01em}

<footer style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 16px 22px; box-sizing: border-box;">

    <nav aria-label="Play steps" style="display: flex; gap: 8px;">
      <div class="step on"><span class="bar"></span><span class="lbl">1 Protect</span></div>
      <div class="step"><span class="bar"></span><span class="lbl">2 Routes</span></div>
      <div class="step"><span class="bar"></span><span class="lbl">3 Read</span></div>
    </nav>
    <div class="sec">
      <div class="sh"><b>Blockers</b><span>Line + RB stay in</span></div>
      <div class="seg" role="radiogroup" aria-label="Blockers"><button role="radio" aria-checked="false">5-man</button><button class="sel" role="radio" aria-checked="true">6-man</button><button role="radio" aria-checked="false">7-man</button></div>
    </div>
    <div class="sec">
      <div class="sh"><b>Line call</b><span>RB takes the right edge</span></div>
      <div class="seg" role="radiogroup" aria-label="Line call">
        <button class="sel" role="radio" aria-checked="true"><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6H2M6 2L2 6L6 10"></path></svg>Slide</button>
        <button role="radio" aria-checked="false">Man</button>
