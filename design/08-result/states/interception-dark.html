<!doctype html>

<title>Result: Interception (dark)</title>

<style>
body{margin:0;background:#18201C}
a{color:#F4EFE4}a:hover{color:#fff}
.pill{height:28px;padding:0 11px;border-radius:14px;background:rgba(6,13,10,.82);color:#F4EFE4;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.stat{flex:1;display:flex;flex-direction:column;gap:5px}
.stat b{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:#E05A2B}
.stat span{font-size:12px;color:#A3B1A9;line-height:1}
.life{width:30px;height:30px;box-sizing:border-box;border-radius:8px;border:1.5px solid #34403A;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#A3B1A9}
.life.lost{border-color:#F4EFE4;background:rgba(244,239,228,.14)}
.life.next{border-color:#F4EFE4;color:#F4EFE4}
.cta{flex-grow:1;height:56px;border:none;border-radius:16px;background:#E05A2B;color:#FFFFFF;font:800 18px Figtree,sans-serif;letter-spacing:.01em;cursor:pointer;text-transform:uppercase;font-weight:900;letter-spacing:.01em}
.sec{width:56px;height:56px;border-radius:16px;border:1px solid #34403A;background:#232C27;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.pill.cov{position:absolute;left:12px;top:50px;background:#F4EFE4;color:#18201C;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.fail .stat b{color:#F4EFE4}
.over .stat span{color:#A3B1A9}
.over .life{border-color:rgba(244,239,228,.3);color:#A3B1A9}
.over .life.lost,.over .life.yds{border-color:#F4EFE4;background:rgba(244,239,228,.14);color:#F4EFE4}
.over .sec{background:transparent;border-color:rgba(244,239,228,.35)}
.life.yds{border-color:#F4EFE4;background:rgba(244,239,228,.14);color:#F4EFE4;font-size:11px;font-weight:800}
.win .stat b{color:#F4B13E}.win .stat span{color:#B3C4BA}
.win .life{border-color:rgba(244,239,228,.3);color:#B3C4BA}
.win .life.lost{border-color:#F4EFE4;background:rgba(244,239,228,.14)}
.win .life.won{border-color:#F4EFE4;background:#F4EFE4}
.win .life.spare{border-style:dashed}
.win .sec{background:transparent;border-color:rgba(244,239,228,.35)}
</style>
